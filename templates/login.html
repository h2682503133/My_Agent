<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>用户登录</title>
</head>
<body>
  <h2>用户登录</h2>

  <label>用户ID：</label>
  <input id="user_id" type="text" placeholder="请输入用户ID" />
  <button onclick="login()">登录</button>

  <script>
    async function login() {
      const userId = document.getElementById("user_id").value.trim();

      if (!userId) {
        alert("请输入用户ID");
        return;
      }

      localStorage.setItem("user_id", userId);

      try {
        await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: userId
          })
        });
      } catch (err) {
        console.warn("登录接口调用失败，但本地仍保存 user_id", err);
      }

      window.location.href = "/chat.html";
    }

    document.getElementById("user_id").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        login();
      }
    });
  </script>
</body>
</html>
